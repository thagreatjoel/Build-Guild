<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Event Closed</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="config.js"></script>
  <style>
    .waiting-card { max-width: 720px; }
    .status-message { font-size: clamp(20px, 4vw, 28px); margin: 18px 0; color: var(--bp-warning); line-height: 1.2; }
  </style>
</head>
<body>
  <a href="https://hackclub.com/" class="banner-link">
    <img src="https://assets.hackclub.com/banners/2026.svg" alt="Hack Club">
  </a>

  <svg width="0" height="0" style="position:fixed">
    <filter id="grainy" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".5" numOctaves="2"/>
      <feColorMatrix type="saturate" values="0"/>
      <feBlend in="SourceGraphic" mode="multiply"/>
    </filter>
  </svg>

  <div class="view active z1">
    <div class="card waiting-card">
      <div class="card-eyebrow">Build Guild Kochi · April 15, 2026</div>
      <div class="card-h1">Welcome, <span id="user-name" style="color:var(--bp-warning)">Guest</span></div>
      <div class="status-message">The event is currently closed by the organizers.</div>
      <div id="admin-note" class="note-box" style="display:none;"></div>
      <div class="card-sub">This page will automatically redirect you when the event opens again.</div>
      <button class="btn btn-outline" onclick="logout()">Logout</button>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <script>
    const session = JSON.parse(localStorage.getItem('eventAccess') || '{}');
    document.getElementById('user-name').textContent = session.displayName || session.username || 'Guest';

    function logout() {
      localStorage.removeItem('eventAccess');
      window.location.href = '/';
    }

    async function loadAdminNote() {
      try {
        const res = await fetch(`${API_BASE_URL}/api/user/event-note`);
        const data = await res.json();
        const noteDiv = document.getElementById('admin-note');
        if (data.text && data.text.trim()) {
          noteDiv.innerHTML = data.text;
          noteDiv.style.display = 'block';
        } else {
          noteDiv.style.display = 'none';
        }
      } catch (err) {
        console.error('Failed to load admin note:', err);
      }
    }

    async function checkEventStatus() {
      try {
        const res = await fetch(`${API_BASE_URL}/api/admin/event-status`);
        const data = await res.json();
        if (data.isOpen) {
          window.location.href = '/dashboard.html';
        }
      } catch (err) {
        console.error('Failed to check event status:', err);
      }
    }

    loadAdminNote();
    setInterval(checkEventStatus, 5000);
    checkEventStatus();
  </script>
</body>
</html>
