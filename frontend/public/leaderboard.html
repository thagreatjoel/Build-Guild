<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Leaderboard — Build Guild Kochi</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="config.js"></script>
  <style>
    .leaderboard-layout { display: grid; gap: 18px; }
    .leader-row { display: grid; grid-template-columns: 88px minmax(0, 1fr) auto; gap: 14px; align-items: center; padding: 14px; border: 1px solid rgba(255,255,255,.12); background: rgba(0,0,0,.16); }
    .leader-rank { font-size: clamp(22px, 4vw, 34px); font-weight: 800; color: #fff; }
    .leader-rank.top-1 { color: #ffd700; }
    .leader-rank.top-2 { color: #d6d6d6; }
    .leader-rank.top-3 { color: #cd7f32; }
    .leader-user { display: flex; align-items: center; gap: 12px; min-width: 0; }
    .leader-avatar { width: 56px; height: 56px; object-fit: cover; border-radius: 14px; border: 1px solid rgba(255,255,255,.16); background: var(--bp-dark); }
    .leader-name { font-size: clamp(18px, 2.4vw, 24px); font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .leader-score { font-size: clamp(18px, 3vw, 28px); font-weight: 800; color: var(--bp-warning); white-space: nowrap; }
    @media (max-width: 700px) {
      .leader-row { grid-template-columns: 1fr; }
      .leader-score { justify-self: start; }
    }
  </style>
</head>
<body>
  <a href="https://hackclub.com/" class="banner-link">
    <img src="https://assets.hackclub.com/banners/2026.svg" alt="Hack Club">
  </a>

  <svg width="0" height="0" style="position:fixed">
    <filter id="grainy" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".5" numOctaves="2"/>
      <feColorMatrix type="saturate" values="0"/>
      <feBlend in="SourceGraphic" mode="multiply"/>
    </filter>
  </svg>

  <main class="page-shell">
    <div class="page-header">
      <div>
        <div class="page-title">Leaderboard</div>
        <div class="topbar-nav">
          <a class="topbar-link" href="/dashboard.html">Overview</a>
          <a class="topbar-link" href="/food-fund.html">Food Fund</a>
          <a class="topbar-link active" href="/leaderboard.html">Leaderboard</a>
        </div>
      </div>
      <div class="pill">Live scores</div>
    </div>

    <div class="stat-grid" style="margin-bottom:18px;">
      <div class="stat-card"><div class="stat-number" id="total-users">0</div><div class="stat-label">Qualified Participants</div></div>
      <div class="stat-card"><div class="stat-number" id="top-score">0</div><div class="stat-label">Top Score</div></div>
      <div class="stat-card"><div class="stat-number">10s</div><div class="stat-label">Refresh Rate</div></div>
    </div>

    <section class="surface leaderboard-layout" id="leaderboard-list">
      <div class="empty-state">Loading leaderboard...</div>
    </section>
  </main>

  <div id="toast" class="toast"></div>

  <script>
    const DEFAULT_AVATAR = "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%230e305b'/%3E%3Ctext x='50' y='65' font-size='40' text-anchor='middle' fill='%23ffc857' font-family='monospace'%3E%F0%9F%91%A4%3C/text%3E%3C/svg%3E";

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    function toast(msg, type) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.className = `toast show t-${type}`;
      setTimeout(() => t.classList.remove('show'), 3400);
    }

    async function loadLeaderboard() {
      try {
        const res = await fetch(`${API_BASE_URL}/api/user/leaderboard`);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const users = await res.json();
        document.getElementById('total-users').textContent = users.length;
        document.getElementById('top-score').textContent = users.length ? users[0].score || 0 : 0;

        const container = document.getElementById('leaderboard-list');
        if (!users.length) {
          container.innerHTML = '<div class="empty-state">No participants yet.</div>';
          return;
        }

        container.innerHTML = users.map((user, index) => {
          const rankClass = index === 0 ? 'top-1' : index === 1 ? 'top-2' : index === 2 ? 'top-3' : '';
          const profilePic = user.profilePicture && user.profilePicture.trim() ? user.profilePicture : DEFAULT_AVATAR;
          return `
            <div class="leader-row">
              <div class="leader-rank ${rankClass}">#${index + 1}</div>
              <div class="leader-user">
                <img class="leader-avatar" src="${escapeHtml(profilePic)}" alt="avatar" onerror="this.src='${DEFAULT_AVATAR}'">
                <div class="leader-name">${escapeHtml(user.username || user.name || user.email.split('@')[0])}</div>
              </div>
              <div class="leader-score">${user.score || 0} pts</div>
            </div>
          `;
        }).join('');
      } catch (err) {
        console.error('Leaderboard error:', err);
        document.getElementById('leaderboard-list').innerHTML = '<div class="empty-state">Failed to load leaderboard.</div>';
      }
    }

    async function checkEventStatus() {
      try {
        const res = await fetch(`${API_BASE_URL}/api/admin/event-status`);
        const data = await res.json();
        if (!data.isOpen) {
          toast('Event has been closed. Redirecting...', 'info');
          setTimeout(() => { window.location.href = '/waiting.html'; }, 1800);
        }
      } catch (err) {
        console.error('Failed to check event status:', err);
      }
    }

    loadLeaderboard();
    setInterval(loadLeaderboard, 10000);
    checkEventStatus();
    setInterval(checkEventStatus, 10000);
  </script>
</body>
</html>
