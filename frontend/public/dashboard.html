<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard — Build Guild Kochi</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="config.js"></script>
  <style>
    .hero-grid { display: grid; grid-template-columns: 320px 1fr; gap: 18px; }
    .profile-card { text-align: center; }
    .profile-avatar { width: 120px; height: 120px; object-fit: cover; border-radius: 12px; cursor: pointer; margin: 0 auto 14px; display: block; }
    .profile-name { font-size: 28px; font-weight: 800; line-height: 1.1; }
    .profile-email { color: rgba(255,255,255,.66); margin-top: 8px; word-break: break-word; }
    .inline-form { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 14px; }
    .inline-form .input { flex: 1 1 220px; }
    .file-input { display: none; }
    .info-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; }
    .muted { color: rgba(255,255,255,.7); line-height: 1.6; }
    @media (max-width: 980px) { .hero-grid, .info-grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <a href="https://hackclub.com/" class="banner-link">
    <img src="https://assets.hackclub.com/banners/2026.svg" alt="Hack Club">
  </a>

  <svg width="0" height="0" style="position:fixed">
    <filter id="grainy" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".5" numOctaves="2"/>
      <feColorMatrix type="saturate" values="0"/>
      <feBlend in="SourceGraphic" mode="multiply"/>
    </filter>
  </svg>

  <main class="page-shell">
    <div class="page-header">
      <div>
        <div class="page-title">Attendee Dashboard</div>
        <div class="topbar-nav">
          <a class="topbar-link active" href="/dashboard.html">Overview</a>
          <a class="topbar-link" href="/food-fund.html">Food Fund</a>
          <a class="topbar-link" href="/leaderboard.html">Leaderboard</a>
        </div>
      </div>
      <button class="btn btn-outline no-print" id="logout-btn">Logout</button>
    </div>

    <div class="hero-grid">
      <section class="surface profile-card">
        <img id="profile-avatar" class="profile-avatar" src="" alt="Profile picture">
        <input type="file" id="avatar-input" accept="image/*" class="file-input">
        <div class="profile-name" id="display-name">Loading...</div>
        <div class="profile-email" id="profile-email"></div>
        <div class="inline-form">
          <input id="edit-name-input" class="input" type="text" placeholder="Update display name">
          <button class="btn btn-primary" id="save-name-btn">Save Name</button>
        </div>
      </section>

      <section class="section-stack">
        <div class="stat-grid">
          <div class="stat-card"><div class="stat-number" id="user-score">0</div><div class="stat-label">Score</div></div>
          <div class="stat-card"><div class="stat-number" id="user-checkin">No</div><div class="stat-label">Checked In</div></div>
          <div class="stat-card"><div class="stat-number" id="user-username">-</div><div class="stat-label">Username</div></div>
        </div>

        <div class="info-grid">
          <section class="surface">
            <div class="card-eyebrow">Event Info</div>
            <div id="announcement" class="muted">Loading announcement...</div>
          </section>

          <section class="surface">
            <div class="card-eyebrow">Quick Links</div>
            <div style="display:grid; gap:10px;">
              <a class="btn btn-primary" href="/food-fund.html">Open Food Fund</a>
              <a class="btn btn-outline" href="/leaderboard.html">Open Leaderboard</a>
            </div>
          </section>
        </div>
      </section>
    </div>
  </main>

  <div id="toast" class="toast"></div>

  <script>
    const session = JSON.parse(localStorage.getItem('eventAccess') || '{}');
    if (!session.loggedIn || Date.now() - session.timestamp > 24 * 60 * 60 * 1000) {
      window.location.href = '/';
    }

    const userEmail = session.email;
    const DEFAULT_AVATAR = "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%230e305b'/%3E%3Ctext x='50' y='65' font-size='40' text-anchor='middle' fill='%23ffc857' font-family='monospace'%3E%F0%9F%91%A4%3C/text%3E%3C/svg%3E";

    function toast(msg, type) {
      const toastDiv = document.getElementById('toast');
      toastDiv.textContent = msg;
      toastDiv.className = `toast show t-${type}`;
      setTimeout(() => toastDiv.classList.remove('show'), 3400);
    }

    function resizeImage(file, maxSize = 220) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.onload = () => {
            let width = img.width;
            let height = img.height;
            if (width > height && width > maxSize) {
              height *= maxSize / width;
              width = maxSize;
            } else if (height > maxSize) {
              width *= maxSize / height;
              height = maxSize;
            }
            const canvas = document.createElement('canvas');
            canvas.width = width;
            canvas.height = height;
            canvas.getContext('2d').drawImage(img, 0, 0, width, height);
            resolve(canvas.toDataURL('image/jpeg', 0.82));
          };
          img.onerror = reject;
          img.src = e.target.result;
        };
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    async function loadProfile() {
      const res = await fetch(`${API_BASE_URL}/api/user/profile?email=${encodeURIComponent(userEmail)}`);
      const data = await res.json();
      if (!res.ok) throw new Error(data.msg || 'Failed to load profile');
      document.getElementById('display-name').textContent = data.name || data.username || data.email.split('@')[0];
      document.getElementById('profile-email').textContent = data.email;
      document.getElementById('edit-name-input').value = data.name || '';
      document.getElementById('user-score').textContent = data.score || 0;
      document.getElementById('user-checkin').textContent = data.checkedIn ? 'Yes' : 'No';
      document.getElementById('user-username').textContent = data.username || '-';
      document.getElementById('profile-avatar').src = data.profilePicture && data.profilePicture.startsWith('data:image') ? data.profilePicture : DEFAULT_AVATAR;
    }

    async function updateProfile(payload) {
      const res = await fetch(`${API_BASE_URL}/api/user/update-profile`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: userEmail, ...payload })
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.msg || 'Update failed');
      return data;
    }

    async function loadAnnouncement() {
      try {
        const res = await fetch(`${API_BASE_URL}/api/user/announcement`);
        const data = await res.json();
        document.getElementById('announcement').innerHTML = data.text || 'No announcement yet.';
      } catch (err) {
        document.getElementById('announcement').innerHTML = 'No announcement yet.';
      }
    }

    async function checkEventStatus() {
      try {
        const res = await fetch(`${API_BASE_URL}/api/admin/event-status`);
        const data = await res.json();
        if (!data.isOpen) {
          toast('Event has been closed. Redirecting...', 'info');
          setTimeout(() => { window.location.href = '/waiting.html'; }, 1800);
        }
      } catch (err) {
        console.error(err);
      }
    }

    document.getElementById('save-name-btn').addEventListener('click', async () => {
      const name = document.getElementById('edit-name-input').value.trim();
      if (!name) return toast('Please enter a valid display name', 'err');
      try {
        await updateProfile({ name });
        toast('Name updated', 'ok');
        loadProfile();
      } catch (err) {
        toast(err.message || 'Failed to save name', 'err');
      }
    });

    document.getElementById('profile-avatar').addEventListener('click', () => {
      document.getElementById('avatar-input').click();
    });

    document.getElementById('avatar-input').addEventListener('change', async (event) => {
      const file = event.target.files[0];
      if (!file) return;
      if (file.size > 2 * 1024 * 1024) return toast('Image too large. Max 2MB.', 'err');
      try {
        const profilePicture = await resizeImage(file);
        await updateProfile({ profilePicture });
        toast('Profile picture updated', 'ok');
        loadProfile();
      } catch (err) {
        toast('Failed to update picture', 'err');
      }
      event.target.value = '';
    });

    document.getElementById('logout-btn').addEventListener('click', async () => {
      await fetch(`${API_BASE_URL}/api/user/login-status`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: userEmail, loggedIn: false })
      }).catch(() => {});
      localStorage.removeItem('eventAccess');
      window.location.href = '/';
    });

    Promise.all([loadProfile(), loadAnnouncement()]).catch((err) => toast(err.message || 'Failed to load dashboard', 'err'));
    checkEventStatus();
    setInterval(checkEventStatus, 10000);
  </script>
</body>
</html>
