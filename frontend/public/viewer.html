<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Slide Viewer</title>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #0e305b;
      height: 100vh;
      overflow: hidden;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
      transition: opacity 0.2s ease, transform 0.2s ease;
      opacity: 1;
      transform: scale(1) rotate(0deg);
    }

    .slide-counter {
      position: fixed;
      bottom: 12px;
      right: 12px;
      background: rgba(0,0,0,0.5);
      color: rgba(255,255,255,0.6);
      font-family: monospace;
      font-size: 12px;
      padding: 4px 8px;
      border-radius: 8px;
      z-index: 10;
    }

    .flash-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #0e305b;
      pointer-events: none;
      z-index: 30;
      opacity: 0;
      transition: opacity 0.15s ease;
    }
  </style>
</head>

<body>

  <iframe id="slideFrame"></iframe>
  <div class="slide-counter" id="counter">1 / 0</div>
  <div class="flash-overlay" id="flashOverlay"></div>

  <script>
    const slides = ["1.html","2.html","3.html","4.html","5.html", "6.html"];

    let currentIndex = 0;
    let isTransitioning = false;

    const frame = document.getElementById('slideFrame');
    const counter = document.getElementById('counter');
    const flash = document.getElementById('flashOverlay');

    function updateCounter() {
      counter.textContent = `${currentIndex + 1} / ${slides.length}`;
    }

    function delay(ms) {
      return new Promise(r => setTimeout(r, ms));
    }

    async function loadSlide(index) {
      if (isTransitioning) return;

      if (index < 0) index = 0;
      if (index >= slides.length) index = slides.length - 1;
      if (index === currentIndex) return;

      isTransitioning = true;

      frame.style.opacity = '0';
      frame.style.transform = 'scale(0.95)';
      flash.style.opacity = '0.6';
      await delay(120);

      currentIndex = index;
      frame.src = `slide/${slides[currentIndex]}`;
      updateCounter();

      await delay(150);
      frame.style.opacity = '1';
      frame.style.transform = 'scale(1)';
      flash.style.opacity = '0';

      isTransitioning = false;
    }

    function nextSlide() { loadSlide(currentIndex + 1); }
    function prevSlide() { loadSlide(currentIndex - 1); }

    // 🔥 SSE (instant control)
    const evtSource = new EventSource("https://build-guild.onrender.com/api/slide/events");

    evtSource.onmessage = (event) => {
      const data = JSON.parse(event.data);

      if (!data.action) return;

      if (data.action === "next") nextSlide();
      if (data.action === "prev") prevSlide();

      // 🔥 NEW: open leaderboard
      if (data.action === "open") {
        window.location.href = "https://kochiguild.netlify.app/leaderboard";
      }
    };

    evtSource.onerror = () => {
      console.log("SSE reconnecting...");
    };

    // keyboard backup
    window.addEventListener('keydown', (e) => {
      if (e.key === 'a') nextSlide();
      if (e.key === 'q') prevSlide();
    });

    // initial load
    frame.src = `slide/${slides[0]}`;
    updateCounter();
  </script>

</body>
</html>
